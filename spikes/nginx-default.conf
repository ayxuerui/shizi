server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
    }

    # Stock nginx:alpine's mime.types doesn't include .webmanifest, so it
    # falls back to application/octet-stream. Some browsers are lenient
    # about this for manifest detection, but it's not worth relying on.
    location ~* \.webmanifest$ {
        root   /usr/share/nginx/html;
        default_type application/manifest+json;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
