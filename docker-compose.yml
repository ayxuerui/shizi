# Pinned explicitly (add-dev-deployment) rather than left to default to
# the launching directory's name. Without this, the compose PROJECT name
# — and therefore any unqualified volume name — is derived from whatever
# checkout this file is run from. This repo's containers were once
# launched from a throwaway git worktree, so the live event-store volume
# was originally named after that worktree until this pin: a fixed name
# here, plus the already-fixed `container_name`s below, is what makes
# production's identity independent of which checkout starts it (see
# specs/deployment/spec.md's "Production identity is independent of the
# working copy"). See infra/README.md for that one-time volume migration.
# (`harden-event-store` later moved the event store itself off a named
# volume entirely, onto a fixed host bind mount — see `sync`'s `volumes:`
# below — but `name: shizi` still matters for container-name/restart
# consistency and any future unqualified resource this file declares.)
name: shizi

services:
  # Serves spikes/ over the local network (port 8080). Throwaway dev
  # tooling for the P0 spikes in tasks.md Section 2 — no longer the
  # target of the shizi.realxco.com public hostname: that's been
  # repointed to `gateway` below, reusing the same domain rather than
  # provisioning a second one (design.md's self-hosted decision entry).
  # This service still runs for local spike access; it's just not
  # tunneled to that hostname anymore.
  spikes:
    image: nginx:1.27-alpine
    container_name: shizi-spikes
    ports:
      - "8080:80"
    volumes:
      - ./spikes:/usr/share/nginx/html:ro
      - ./spikes/nginx-default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    networks:
      - cloudflared-net

  # Task 9.1: static PWA hosting, and the single "holding service" /
  # gateway container — the ONE thing the Cloudflare Tunnel needs to
  # point at, named `shizi` (not `shizi-assessment`) so managing it stays
  # a one-time dashboard action regardless of how many apps end up served
  # from it. Per design.md's self-hosted decision (Cloudflare
  # Pages/Worker/D1 → self-hosted, no Cloudflare account needed) — same
  # pattern as `spikes` above, just serving a real build instead of raw
  # spike HTML.
  #
  # harden-prod-deployment: this now BUILDS an image
  # (infra/gateway.Dockerfile) rather than bind-mounting a host-built
  # apps/assessment/dist — production no longer depends on any git
  # checkout existing on disk at all (see that change's design.md). A new
  # release is a deliberate `docker compose build gateway && docker
  # compose up -d gateway` from the deploy clone (infra/README.md), not a
  # side effect of building or deleting files in some working tree.
  # `docker-compose.dev.yml`'s gateway keeps bind-mounting its working
  # tree ON PURPOSE — reflecting whatever's under verification is
  # precisely dev's job, and that asymmetry with prod must not be "fixed"
  # into symmetry (specs/deployment/spec.md's "Non-production may serve
  # directly from a working tree").
  #
  # Reuses shizi.realxco.com (already tunneled, previously pointed at
  # `spikes`) rather than a second hostname — the app is served under
  # /assessment/ (matching vite.config.ts's `base`), and nginx also
  # reverse-proxies /assessment/sync/* to the `sync` service below (see
  # infra/nginx-assessment.conf.template), so the app and its sync
  # endpoint are same-origin. A future second app would get its own path
  # prefix on this same container rather than a second tunnel target.
  gateway:
    build:
      context: .
      dockerfile: infra/gateway.Dockerfile
      args:
        # Same-origin relative path — no CORS, no second hostname (see
        # infra/README.md's "Domain reuse"). VITE_SYNC_TOKEN comes from
        # the shell environment at build/release time (infra/README.md's
        # release procedure), not from a file baked into any image layer.
        VITE_SYNC_ENDPOINT: /assessment/sync
        VITE_SYNC_TOKEN: ${VITE_SYNC_TOKEN}
        # add-issue-reporting: the short git SHA baked into the build so an
        # issue report can say which build produced it. .dockerignore
        # excludes .git/, so the image build can't read it itself — the
        # release procedure exports it (infra/README.md). Omitted, reports
        # say "unknown": valid, just less useful.
        VITE_BUILD_ID: ${VITE_BUILD_ID:-unknown}
    image: shizi-gateway:latest
    container_name: shizi-gateway
    ports:
      - "8081:80"
    volumes:
      # Published learner config is derived data
      # (infra/sync-service/scripts/publish-config.ts), regenerated on
      # its own cadence independent of the app — mounting only this ONE
      # file (not the whole served root, and not baked into the image)
      # lets it update with no rebuild and no release. A missing or
      # malformed file here is a handled case at the APPLICATION level:
      # apps/assessment/src/session/published-config.ts's
      # loadPublishedConfig() falls back to its bundled pool on ANY
      # fetch/parse failure.
      #
      # The mount source MUST live outside the deploy clone
      # (~/.config/shizi/config.json — same durable-location treatment
      # as the shared token, see infra/README.md), NOT a path inside
      # any git checkout. Found the hard way: a bind mount whose SOURCE
      # directory disappears entirely (the whole point of this change —
      # the deploy clone is disposable for uptime) makes the CONTAINER
      # ITSELF fail to even start on the next restart/recreate — that's
      # a much harder failure than a missing file the app can gracefully
      # degrade from, and it defeated this change's own "no checkout,
      # still serving" guarantee the first time it was actually tested.
      # The host file must exist (even empty) before the FIRST
      # `docker compose up` here — Docker creates an empty DIRECTORY at
      # this path instead of a file if it doesn't already exist, which
      # is not what either side expects — see infra/README.md's setup
      # steps. Publish with `publish-config.ts --out
      # ~/.config/shizi/config.json`, not its repo-relative default.
      - /home/ubuntu/.config/shizi/config.json:/usr/share/nginx/html/config.json:ro
    environment:
      # Prod's gateway reaches prod's sync service and nothing else. Both
      # stacks sit on cloudflared-net, and docker aliases every container
      # by its compose service name on each network it joins — so the dev
      # sync service is deliberately named `sync-dev` AND kept off this
      # network entirely, rather than relying on this value alone.
      SYNC_UPSTREAM: sync
      # Restricts envsubst to that ONE variable. nginx's own runtime
      # variables ($host, $scheme, $proxy_add_x_forwarded_for) use the
      # same syntax and would otherwise be fair game for substitution.
      NGINX_ENVSUBST_FILTER: "^SYNC_UPSTREAM$$"
    restart: unless-stopped
    networks:
      - cloudflared-net

  # Tasks 9.2/9.3: the sync endpoint + event store (self-hosted SQLite,
  # not Cloudflare D1 — see design.md). Requires SYNC_SHARED_TOKEN set;
  # the service refuses to start without it. The bind mount below
  # persists the live SQLite file + backup snapshots across container
  # restarts — the ACTUAL durable backup is data/events/events.jsonl
  # (see infra/sync-service/scripts/pull-events.ts), committed to git,
  # not this directory. No host port published: reached only via
  # `gateway`'s nginx reverse-proxy (/assessment/sync/*) over this
  # shared docker network, not directly from outside it — nothing else
  # needs to reach it. Use
  # `docker compose exec sync curl localhost:8787/health` for direct
  # local debugging if needed.
  sync:
    build:
      context: .
      dockerfile: infra/sync-service/Dockerfile
    container_name: shizi-sync
    # harden-prod-deployment: an ABSOLUTE path outside every git working
    # tree, not `./infra/sync-service/.env` — this file must survive a
    # `git clean -xfd`, a branch switch, or a worktree deletion in the
    # checkout this compose file happens to be run from. Create it per
    # infra/README.md's setup steps; it also supplies VITE_SYNC_TOKEN for
    # the gateway's build (see that service's `args:` above) via being
    # `source`d directly, not through this env_file mechanism.
    env_file:
      - /home/ubuntu/.config/shizi/prod.env
    environment:
      PORT: 8787
      EVENTS_DB_PATH: /repo/infra/sync-service/data/events.sqlite
      BACKUP_DIR: /repo/infra/sync-service/data/backups
      # Read by scripts/pull-events.ts to refuse writing this store's
      # events into the repo's canonical data/events/*.jsonl unless this
      # is really production (add-dev-deployment) — see sync-dev's own
      # SHIZI_ENV=dev in docker-compose.dev.yml.
      SHIZI_ENV: prod
    # harden-event-store: a fixed host bind mount, not a Docker-managed
    # named volume — so a host-side script (backup, ad hoc inspection)
    # can reach the live store at a known path with no `docker volume
    # inspect` step. Sibling to ~/.config/shizi/ (config/secrets):
    # ~/.local/share/shizi/ is durable application DATA (the growing
    # database and its own periodic snapshots), kept in a separate
    # location so the two kinds of durable state don't get mixed (see
    # design.md's "second durable-location convention" decision). The
    # old `events-data` named volume from before this change is left
    # in place, untouched, as the rollback path.
    volumes:
      - /home/ubuntu/.local/share/shizi/sync-data:/repo/infra/sync-service/data
    restart: unless-stopped
    networks:
      - cloudflared-net

  # harden-event-store: the daily backup schedule, as a container
  # instead of an entry in the host's own crontab — see
  # infra/backup-cron.Dockerfile for why, and
  # infra/sync-service/scripts/backup-and-push.ts for what actually
  # runs. Bind-mounts the SAME real state the human release workflow
  # already uses: the deploy clone itself (read-write — this is what
  # actually gets committed to and pushed, no second internal clone),
  # the deploy key (at the exact absolute path the clone's own git
  # config already expects via `core.sshCommand`, so nothing needed to
  # change there), and the event store (read-only — backup only reads
  # it). Deliberately NOT on `cloudflared-net` — it has no reason to
  # talk to `gateway`/`sync`, only needs outbound internet for the git
  # push, which the default per-project bridge network already
  # provides.
  backup-cron:
    build:
      context: .
      dockerfile: infra/backup-cron.Dockerfile
    container_name: shizi-backup-cron
    volumes:
      - /home/ubuntu/deploy/shizi:/repo
      - /home/ubuntu/.config/shizi/deploy-key:/home/ubuntu/.config/shizi/deploy-key:ro
      - /home/ubuntu/.local/share/shizi/sync-data:/home/ubuntu/.local/share/shizi/sync-data:ro
    restart: unless-stopped

networks:
  cloudflared-net:
    name: cloudflared-net
    external: true
